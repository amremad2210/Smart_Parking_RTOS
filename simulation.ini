// 1. Give the simulator permission to read/write hardware memory
MAP 0x40000000, 0x400FFFFF READ WRITE

// 2. Set Active-Low pins to '1' (Released State)
// Port B (Limit Switches PB0, PB1)
PORTB = 0x03; 

// Port D (Driver Buttons PD0, PD1)
PORTD = 0x03;

// Port E (Security Buttons PE0, PE1)
PORTE = 0x03;

// 3. Set Active-High pins to '0' (Released State)
// Port F (Obstacle PF4 is bit 4)
PORTF = 0x00;

// 4. Define the Toolbox buttons automatically so you don't have to type them
define button "Dr OPEN Press", "PORTD &= ~(1<<1)"
define button "Dr OPEN Rel",   "PORTD |= (1<<1)"
define button "Dr CLOSE Press", "PORTD &= ~(1<<0)"
define button "Dr CLOSE Rel",   "PORTD |= (1<<0)"
define button "Sec OPEN Press", "PORTE &= ~(1<<1)"
define button "Sec OPEN Rel",   "PORTE |= (1<<1)"
define button "Sec CLOSE Press", "PORTE &= ~(1<<0)"
define button "Sec CLOSE Rel",   "PORTE |= (1<<0)"
define button "Limit OPEN Hit", "PORTB &= ~(1<<1)"
define button "Limit OPEN Clr", "PORTB |= (1<<1)"
define button "Limit CLSD Hit", "PORTB &= ~(1<<0)"
define button "Limit CLSD Clr", "PORTB |= (1<<0)"


exec("DIR VTREG"); // Display virtual registers in command window